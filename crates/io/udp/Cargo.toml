[package]
name = "lightyear_udp"
version = "0.28.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "IO primitives for the lightyear networking library"
repository = "https://github.com/cBournhonesque/lightyear"

[features]
default = []
server = ["bevy_platform"]
metrics = ["dep:metrics"]

[dependencies]
# rb pin (glvno/rocket_balls#627): registry deps, NOT the workspace path-deps — consumed via
# [patch.crates-io] from outside this workspace, path-deps would drag a SECOND copy of
# lightyear_link/core into the consumer's build whose component types (Linked, Link, ...) are
# disjoint from the crates.io ones the rest of lightyear uses, silently breaking the transport
# (the send system's With<Linked> never matches).
lightyear_core = { version = "0.28.0", default-features = false }
lightyear_link = { version = "0.28.0", default-features = false }

aeronet_io.workspace = true

metrics = { workspace = true, optional = true }
tracing.workspace = true

# bevy
bevy_app.workspace = true
bevy_ecs = { workspace = true, features = ["std"] }
bevy_platform = { workspace = true, optional = true }

# utils
bytes.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
